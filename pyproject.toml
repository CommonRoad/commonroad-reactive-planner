[tool.poetry]
name = "commonroad-reactive-planner"
version = "2024.1"
description = "CommonRoad Reactive Planner: Sampling-based Frenet Planner"
authors = ["Cyber-Physical Systems Group, Technical University of Munich <commonroad@lists.lrz.de>"]
license = "BSD"
readme = "README.md"
homepage = "https://commonroad.in.tum.de"
keywords= ["autonomous", "automated", "vehicles", "driving", "motion", "planning"]
classifiers = [
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux"
]

packages = [{include = "commonroad_rp"}]

[tool.poetry.urls]
Source = "https://gitlab.lrz.de/tum-cps/commonroad-reactive-planner"

[tool.poetry.dependencies]
python = ">=3.10, <3.11"

matplotlib = ">=2.2.2"
networkx = ">=2.2"
numpy = ">=1.22,<2.0"
methodtools = "^0.4.5"
omegaconf = ">=2.1.1"
scipy = ">=1.5.2"
imageio = ">=2.13.5"
triangle = ">=20230923"

commonroad-route-planner = ">=2025.0.1"
commonroad-io = ">=2024.2"
commonroad-drivability-checker = ">=2024.1"
commonroad_vehicle_models = ">=3.0.2"

commonroad-monitor = { git = "git@gitlab.lrz.de:cps/commonroad/commonroad-monitor.git", branch = "develop" }
commonroad-velocity-planner = { git = "git@gitlab.lrz.de:cps/commonroad/commonroad-velocity-planner.git", branch = "develop"}

commonroad-reach = { version = "^2024.1", optional = true }

[tool.poetry.extras]
reach = ["commonroad-reach"]

# docs
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = ">=2.2.1"
mkdocstrings-python = "^1.8.0"
mkdocs-material = "^9.5.10"

# tests
[tool.poetry.group.tests]
optional = true

[tool.poetry.group.tests.dependencies]
pytest = ">=6.2.5"
coverage = "^6.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
