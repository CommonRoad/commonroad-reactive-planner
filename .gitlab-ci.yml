image: python:3.10

cache:
  paths:
    - .venv

stages:
  - test
  - install_test
  - deploy


before_script:
  - pip install poetry
  - poetry config virtualenvs.in-project true
  - poetry install --with tests,docs
  - source .venv/bin/activate

########## Test ###############
unittest:
  stage: test
  script:
    - coverage run --source=./commonroad_rp -m unittest discover test
    - coverage report -m || true
    - coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
   reports:
     coverage_report:
       coverage_format: cobertura
       path: coverage.xml


# IMPORTANT --> Empty cache, otherwise unpredictable / racing condition during installs
test_install:
  image : python:$PYTHON_VERSIONS
  cache: []
  stage: install_test
  parallel:
    matrix:
      - PYTHON_VERSIONS: ["3.8", "3.10", "3.9", "3.11"]
  script:
    - pip install poetry
    - poetry config virtualenvs.in-project true
    - poetry install
    - source .venv/bin/activate




######## Deploy ####################
push_to_internal_pipy_registry:
  # push the development version to the internal pipy registry https://gitlab.lrz.de/cps/reactive-planner/-/packages
  # before manually triggering the job, delete the previous package in case the version number didn't change
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "development"
      when: manual
  script:
    - poetry config repositories.gitlab ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
    - poetry build
    - poetry publish --repository gitlab -u gitlab-ci-token -p ${CI_JOB_TOKEN}

push_to_external_pipy_test_registry:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
  script:
    - poetry config repositories.test https://test.pypi.org/legacy/
    - poetry build
    - poetry publish --repository test -u __token__ -p ${CR_PYPI_TEST_API_TOKEN}

push_to_external_pipy_release_registry:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
  script:
    - poetry build
    - poetry publish -u __token__ -p ${CR_PYPI_RELEASE_API_TOKEN}
